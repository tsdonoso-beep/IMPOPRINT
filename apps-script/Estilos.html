<style>
  /* Identidad INROPRIN — azul #036EB1 · rojo #E30613 · teal #01A298 */
  :root {
    /* Mismas familias que InroScan: Sora para títulos, DM Sans para el resto. */
    --display: Sora, "DM Sans", ui-sans-serif, system-ui, sans-serif;
    --texto: "DM Sans", Sora, ui-sans-serif, system-ui, sans-serif;
    --mono: "DM Mono", ui-monospace, monospace;

    --surface: #ffffff;
    --lienzo: #eef1f4;
    --ink: #101a24;
    --ink-2: #44505c;
    --ink-soft: #7b8794;
    --line: #e4e8ec;
    --line-strong: #d2d8de;
    --brand: #036eb1;
    --accent: #01a298;
    --accent-deep: #018a82;
    --accent-soft: #e2f4f2;
    --bad: #e30613;
    --warn-bg: #fdf1dc;
    --warn-ink: #8a5b00;
    --radius: 12px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--surface);
    color: var(--ink);
    font-family: var(--texto);
    -webkit-font-smoothing: antialiased;
    font-size: 14px;
  }

  h1, h2, h3, .producto b, .nav-sec, .zona h3, .recorrido b, .panel h3 {
    font-family: var(--display);
  }

  .app { display: flex; min-height: 100vh; align-items: stretch; }

  /* ══════════ BARRA LATERAL ══════════ */
  aside {
    width: 278px; flex: none;
    border-right: 1px solid var(--line);
    padding: 24px 20px 18px;
    display: flex; flex-direction: column;
  }
  .marca {
    display: flex; align-items: center; gap: 11px;
    padding-bottom: 18px; border-bottom: 1px solid var(--line);
  }
  .logo-svg { width: 38px; height: 38px; flex: none; }
  .marca span { font-size: 15px; line-height: 1.16; color: var(--ink); }
  .marca b { font-weight: 800; }

  .producto { margin: 22px 0 26px; }
  .producto b { font-size: 21px; font-weight: 400; letter-spacing: -.02em; color: var(--ink); }
  .producto b i { font-style: normal; font-weight: 800; color: var(--accent); }
  .producto span {
    display: block; margin-top: 5px;
    font-size: 11px; font-weight: 700; letter-spacing: .13em; color: var(--ink-soft);
  }

  nav { flex: 1; }
  .nav-sec {
    margin: 22px 0 9px;
    font-size: 11px; font-weight: 700; letter-spacing: .13em; color: var(--ink-soft);
  }
  .nav-sec:first-child { margin-top: 0; }

  .nav-item {
    display: flex; align-items: center; gap: 11px;
    padding: 8px 10px; margin: 0 -10px;
    border-radius: 9px; cursor: pointer;
    color: var(--ink-2); font-size: 14.5px; text-decoration: none;
    transition: background .12s;
  }
  .nav-item:hover { background: #f4f6f8; }
  .nav-item svg { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; }
  .nav-item.activo { color: var(--accent); font-weight: 600; }
  .nav-item.activo svg { stroke: var(--accent); }
  .nav-item.inerte { color: #b3bcc5; cursor: default; }
  .nav-item.inerte:hover { background: none; }
  .nav-txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .chip-falta {
    background: var(--warn-bg); color: var(--warn-ink);
    font-size: 10.5px; font-weight: 700; line-height: 1.25;
    border-radius: 999px; padding: 3px 9px; text-align: center;
  }

  .pie { border-top: 1px solid var(--line); padding-top: 16px; }
  .clave {
    width: 100%; display: flex; align-items: center; gap: 11px;
    background: #f6f8f9; border: 1px solid var(--line);
    border-radius: 10px; padding: 11px 13px; cursor: pointer;
    font-family: inherit; text-align: left; transition: border-color .12s;
  }
  .clave:hover { border-color: var(--line-strong); }
  .clave.sin b { color: var(--ink); }
  .clave b { display: block; font-size: 13.5px; font-weight: 600; color: var(--ink); }
  .clave em {
    display: block; font-style: normal; margin-top: 2px;
    font-family: var(--mono); font-size: 11.5px; color: var(--ink-soft);
  }
  .clave.lista em { color: var(--accent); }
  .clave svg { width: 17px; height: 17px; flex: none; stroke: var(--ink-soft); fill: none; stroke-width: 1.7; }
  .mail { margin: 13px 0 0; font-family: var(--mono); font-size: 11.5px; color: var(--ink-soft); }

  /* ══════════ CONTENIDO ══════════ */
  main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .encabezado { padding: 26px 34px 20px; }
  .encabezado h1 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -.015em; }
  .encabezado p { margin: 5px 0 0; font-size: 14px; color: var(--ink-soft); }

  .lienzo { flex: 1; background: var(--lienzo); padding: 26px 34px 44px; }
  .hoja {
    background: var(--surface); border-radius: var(--radius);
    box-shadow: 0 1px 2px rgba(23,32,42,.06);
    padding: 26px 28px; max-width: 1060px; margin: 0 auto 18px;
  }

  /* Pasos — subordinados al título, no compiten con él */
  .pasos {
    display: flex; align-items: center; gap: 10px;
    max-width: 1060px; margin: 0 auto 16px;
    font-size: 11px; font-weight: 700; letter-spacing: .1em; color: var(--ink-soft);
  }
  .pasos i { width: 26px; height: 1px; background: var(--line-strong); }
  .pasos span.on { color: var(--accent); }
  .pasos span.ok { color: var(--ink-2); }

  h2 { font-size: 16px; margin: 0 0 4px; letter-spacing: -.01em; }
  .sub { font-size: 13.5px; color: var(--ink-soft); margin: 0 0 18px; line-height: 1.55; }
  .nota { font-size: 13px; color: var(--ink-soft); text-align: center; margin: 16px 0 0; line-height: 1.5; }

  label { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-2); margin-bottom: 6px; }
  input[type=text], input[type=password] {
    width: 100%; padding: 11px 13px; font-size: 14px; font-family: inherit;
    border: 1px solid var(--line-strong); border-radius: 9px; background: #fff; outline: none;
  }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  /* Panel protagonista de la fase 1 */
  .zona {
    border: 1.5px dashed var(--line-strong); border-radius: var(--radius);
    background: #fbfcfd; padding: 40px 32px; text-align: center;
  }
  .zona .icono {
    width: 54px; height: 54px; margin: 0 auto 16px;
    border: 1px solid var(--line-strong); border-radius: 50%;
    display: grid; place-items: center; background: #fff;
  }
  .zona .icono svg { width: 22px; height: 22px; stroke: var(--ink-soft); fill: none; stroke-width: 1.6; }
  .zona h3 { margin: 0 0 6px; font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
  .zona p { margin: 0 0 20px; font-size: 13.5px; color: var(--ink-soft); }
  .zona .fila { display: flex; gap: 10px; max-width: 620px; margin: 0 auto; }
  .zona .fila input { flex: 1; }

  /* Carpeta ya escaneada: ocupa poco, porque el foco pasa a la lista */
  .resumen { display: flex; align-items: center; gap: 14px; padding: 15px 20px; }
  .resumen > svg { width: 20px; height: 20px; flex: none; stroke: var(--accent); fill: none; stroke-width: 1.7; }
  .resumen-txt { flex: 1; min-width: 0; }
  .resumen-txt b { display: block; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .resumen-txt span { font-size: 12.5px; color: var(--ink-soft); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border: 0; border-radius: 9px; padding: 11px 22px;
    font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer;
    transition: .13s; white-space: nowrap;
  }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn-principal { background: var(--accent); color: #fff; }
  .btn-principal:not(:disabled):hover { background: var(--accent-deep); }
  .btn-suave { background: #fff; color: var(--ink-2); border: 1px solid var(--line-strong); }
  .btn-suave:hover { background: #f4f6f8; }
  .btn-alerta { background: #fff; color: var(--bad); border: 1px solid rgba(227,6,19,.32); }
  .btn-sm { padding: 8px 15px; font-size: 13px; }
  .acciones { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 18px; }

  /* Listas de documentos */
  ul.docs { list-style: none; margin: 0; padding: 0; }
  ul.docs li {
    display: flex; align-items: center; gap: 11px;
    padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 13.5px;
  }
  ul.docs li:last-child { border-bottom: 0; }
  ul.docs .nom { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
  .kb { color: var(--ink-soft); font-variant-numeric: tabular-nums; font-size: 12.5px; }
  .ruta { color: var(--ink-soft); }
  input[type=checkbox] { accent-color: var(--accent); width: 15px; height: 15px; }

  .chip {
    display: inline-flex; align-items: center; border-radius: 999px;
    padding: 3px 10px; font-size: 11px; font-weight: 600; white-space: nowrap;
  }
  .chip-skip { background: #f1f3f5; color: var(--ink-soft); }
  .chip-force { background: var(--accent-soft); color: #056b64; }
  .chip-warn { background: var(--warn-bg); color: var(--warn-ink); }
  .chip-bad { background: #fdeaeb; color: #a4040e; }
  .chip-neutro { background: #f1f3f5; color: var(--ink-2); }

  .barra { height: 7px; border-radius: 999px; background: #e8ecef; overflow: hidden; margin-top: 16px; }
  .barra > div { height: 100%; background: var(--accent); border-radius: 999px; transition: width .4s ease; }

  .aviso { font-size: 13.5px; padding: 12px 15px; border-radius: 9px; margin-top: 14px; line-height: 1.5; }
  .aviso-error { background: #fdeaeb; color: #a4040e; }
  .aviso-ok { background: var(--accent-soft); color: #04635c; }
  .aviso a { color: inherit; }

  .recorrido { counter-reset: paso; list-style: none; padding: 0; margin: 0; }
  .recorrido li { position: relative; padding: 0 0 22px 42px; }
  .recorrido li:before {
    counter-increment: paso; content: counter(paso);
    position: absolute; left: 0; top: -1px;
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--accent-soft); color: #056b64;
    display: grid; place-items: center; font-size: 12.5px; font-weight: 700;
  }
  .recorrido b { display: block; font-size: 14.5px; margin-bottom: 3px; }
  .recorrido span { color: var(--ink-soft); font-size: 13.5px; line-height: 1.55; }

  .oculto { display: none !important; }
  .rise { animation: rise .4s cubic-bezier(.22,1,.36,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }

  /* Panel de la clave */
  .velo { position: fixed; inset: 0; background: rgba(23,32,42,.4); z-index: 40; }
  .panel {
    position: fixed; z-index: 50; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 400px; max-width: calc(100vw - 32px);
    background: #fff; border-radius: var(--radius);
    box-shadow: 0 18px 50px -12px rgba(23,32,42,.35); padding: 24px;
  }
  .panel h3 { margin: 0 0 6px; font-size: 16px; }
  .panel p { margin: 0 0 16px; font-size: 13px; color: var(--ink-soft); line-height: 1.55; }
  .panel a { color: var(--brand); }

  @media (max-width: 860px) {
    .app { flex-direction: column; }
    aside { width: auto; border-right: 0; border-bottom: 1px solid var(--line); }
    nav, .pie { display: none; }
    .encabezado, .lienzo { padding-left: 18px; padding-right: 18px; }
    .zona .fila { flex-direction: column; }
  }
</style>
