<style>
  /* Identidad INROPRIN — azul #036EB1 · rojo #E30613 · teal #01A298 */
  :root {
    --paper: #f5f6f8;
    --paper-2: #eef0f3;
    --surface: #ffffff;
    --ink: #191c20;
    --ink-2: #3b4149;
    --ink-soft: #6b7280;
    --line: #e6e8ec;
    --line-strong: #d3d7dd;
    --brand: #036eb1;
    --brand-deep: #025a91;
    --accent: #01a298;
    --accent-soft: #d6f0ee;
    --bad: #e30613;
    --warn: #d9a400;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(20,25,31,.05), 0 10px 26px -14px rgba(20,25,31,.22);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background:
      radial-gradient(1100px 560px at 100% -5%, rgba(1,162,152,.05), transparent 60%),
      radial-gradient(900px 520px at -8% 0%, rgba(3,110,177,.06), transparent 55%),
      var(--paper);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 900px; margin: 0 auto; padding: 0 16px 56px; }

  header {
    position: sticky; top: 0; z-index: 20;
    background: rgba(245,246,248,.88);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .bar {
    max-width: 900px; margin: 0 auto; padding: 12px 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .marca { display: flex; align-items: center; gap: 10px; }
  .logo {
    width: 38px; height: 38px; border-radius: 10px; flex: none;
    background: var(--brand); color: #fff;
    display: grid; place-items: center; font-weight: 800; font-size: 15px;
  }
  .marca b { display: block; font-size: 16px; letter-spacing: -.02em; }
  .marca span { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-soft); }

  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 20px; margin-top: 18px;
  }

  h2 { font-size: 17px; margin: 0 0 4px; letter-spacing: -.015em; }
  .sub { font-size: 13px; color: var(--ink-soft); margin: 0 0 16px; }

  label { display: block; font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: 6px; }

  input[type=text], input[type=password] {
    width: 100%; padding: 10px 12px; font-size: 14px;
    border: 1px solid var(--line-strong); border-radius: 10px;
    background: #fff; outline: none; font-family: inherit;
  }
  input[type=text]:focus, input[type=password]:focus { border-color: var(--brand); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border: 0; border-radius: 999px; padding: 10px 20px;
    font-size: 14px; font-weight: 600; font-family: inherit;
    cursor: pointer; transition: .15s;
  }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn-primary { background: var(--brand); color: #fff; }
  .btn-primary:not(:disabled):hover { background: var(--brand-deep); }
  .btn-accent { background: var(--accent); color: #fff; }
  .btn-accent:not(:disabled):hover { filter: brightness(1.06); }
  .btn-ghost { background: #fff; color: var(--ink-2); border: 1px solid var(--line-strong); }
  .btn-ghost:hover { background: var(--paper-2); }
  .btn-danger { background: rgba(227,6,19,.06); color: var(--bad); border: 1px solid rgba(227,6,19,.3); }
  .btn-sm { padding: 6px 14px; font-size: 13px; }

  .acciones { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }

  /* Stepper */
  ol.pasos { display: flex; align-items: center; gap: 8px; list-style: none; padding: 0; margin: 22px 0 0; font-size: 13px; }
  ol.pasos li { display: flex; align-items: center; gap: 8px; }
  .num {
    width: 24px; height: 24px; border-radius: 999px; display: grid; place-items: center;
    font-size: 12px; font-weight: 700; background: var(--paper-2); color: var(--ink-soft);
  }
  .paso-on .num { background: var(--ink); color: #fff; }
  .paso-ok .num { background: var(--accent); color: #fff; }
  .paso-on span, .paso-ok span { color: var(--ink); font-weight: 600; }
  ol.pasos span { color: var(--ink-soft); }
  .guion { width: 28px; height: 1px; background: var(--line-strong); }

  /* Lista de archivos */
  ul.docs { list-style: none; margin: 0; padding: 0; }
  ul.docs li {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13px;
  }
  ul.docs li:last-child { border-bottom: 0; }
  ul.docs .nom { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
  .kb { color: var(--ink-soft); font-variant-numeric: tabular-nums; }

  .chip {
    display: inline-flex; align-items: center; gap: 4px;
    border-radius: 999px; padding: 2px 9px; font-size: 11px; font-weight: 600; white-space: nowrap;
  }
  .chip-skip { background: var(--paper-2); color: var(--ink-soft); }
  .chip-force { background: var(--accent-soft); color: #067a72; }
  .chip-warn { background: #fdf3d6; color: #8a6b00; }
  .chip-ok { background: var(--accent-soft); color: #067a72; }
  .chip-bad { background: rgba(227,6,19,.08); color: var(--bad); }
  .chip-neutro { background: var(--paper-2); color: var(--ink-2); }

  /* Barra de progreso */
  .barra { height: 8px; border-radius: 999px; background: var(--paper-2); overflow: hidden; margin-top: 14px; }
  .barra > div { height: 100%; background: var(--brand); border-radius: 999px; transition: width .4s ease; }

  .aviso { font-size: 13px; padding: 11px 14px; border-radius: 10px; margin-top: 14px; }
  .aviso-error { background: rgba(227,6,19,.06); color: #a4040e; border: 1px solid rgba(227,6,19,.2); }
  .aviso-ok { background: var(--accent-soft); color: #056b64; border: 1px solid rgba(1,162,152,.25); }

  .oculto { display: none !important; }
  .rise { animation: rise .45s cubic-bezier(.22,1,.36,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* Panel API Key */
  .panel {
    position: absolute; right: 16px; top: 62px; z-index: 30; width: 330px;
    background: #fff; border: 1px solid var(--line-strong);
    border-radius: 12px; box-shadow: var(--shadow); padding: 16px;
  }
  .panel h3 { margin: 0 0 4px; font-size: 14px; }
  .panel p { margin: 0 0 12px; font-size: 12px; color: var(--ink-soft); line-height: 1.5; }
  .panel a { color: var(--brand); }

  .resumen { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 4px; }
  .resumen div { font-size: 13px; color: var(--ink-soft); }
  .resumen b { display: block; font-size: 20px; color: var(--ink); font-variant-numeric: tabular-nums; }
</style>
